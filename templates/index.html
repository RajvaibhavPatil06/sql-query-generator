<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI SQL Query Generator</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; background:#111; color:#eee; }
  input { width: 100%; padding: .7rem; font-size: 1rem; box-sizing: border-box; background:#1c1c1c; color:#eee; border:1px solid #444; border-radius:6px; }
  button { margin-top: .6rem; padding: .6rem 1.2rem; font-size: 1rem; cursor: pointer; border-radius:6px; border:0; background:#3b82f6; color:#fff; }
  button:disabled { opacity:.5; }
  pre { background:#1c1c1c; padding:.8rem; border-radius:6px; overflow-x:auto; }
  table { border-collapse: collapse; margin-top: 1rem; width:100%; }
  th, td { border: 1px solid #444; padding: .4rem .7rem; text-align: left; }
  .err { color: #f87171; }
  .wrap { overflow-x:auto; }
</style>
</head>
<body>
  <h1>AI SQL Query Generator</h1>
  <input id="q" placeholder="e.g. Total order amount per city" maxlength="500" autofocus>
  <button id="go">Generate &amp; Run</button>
  <div id="out"></div>
<script>
const q = document.getElementById("q"), go = document.getElementById("go"), out = document.getElementById("out");

async function run() {
  const question = q.value.trim();
  if (!question) return;
  go.disabled = true; out.textContent = "Thinking...";
  try {
    const r = await fetch("/api/query", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question})
    });
    const d = await r.json();
    out.textContent = "";
    if (d.sql) {
      const pre = document.createElement("pre");
      pre.textContent = d.sql;
      out.appendChild(pre);
    }
    if (d.error) {
      const p = document.createElement("p");
      p.className = "err"; p.textContent = d.error;
      out.appendChild(p);
      return;
    }
    const wrap = document.createElement("div"); wrap.className = "wrap";
    const t = document.createElement("table");
    const hr = t.insertRow();
    d.columns.forEach(c => { const th = document.createElement("th"); th.textContent = c; hr.appendChild(th); });
    d.rows.forEach(row => {
      const tr = t.insertRow();
      row.forEach(v => { tr.insertCell().textContent = v === null ? "NULL" : v; });
    });
    wrap.appendChild(t); out.appendChild(wrap);
  } catch (e) {
    out.textContent = "Network error.";
  } finally {
    go.disabled = false;
  }
}
go.addEventListener("click", run);
q.addEventListener("keydown", e => { if (e.key === "Enter") run(); });
</script>
</body>
</html>
